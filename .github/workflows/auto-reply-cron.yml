# Auto-reply to recruiters — its own schedule, separate from the agents cron.
#
# Speed is the whole point: a recruiter who gets an answer the same hour is in a
# different position from one answered tomorrow morning. On the shared 4x/day
# agents schedule, mail arriving just after a tick waited up to ~17 hours.
#
# Every 5 minutes is cheap here. The pipeline checks the kill switch, the
# 9am-6pm New York window and the runaway breaker BEFORE touching Gmail or Groq,
# so any tick outside business hours costs one database read and returns.
# 132 runs a day, and Actions minutes are free on a public repo.
#
# This is what makes Gmail Pub/Sub push unnecessary. Push would buy roughly two
# and a half minutes of average latency in exchange for a Cloud project, a
# public webhook on a site that emails a resume, and a watch registration that
# expires every 7 days and fails silently when it lapses.
#
# Note: GitHub schedules are best effort and can be delayed under load,
# especially on the hour, so treat 5 minutes as typical rather than guaranteed.
#
# Setup: CRON_SECRET must exist as a GitHub repo secret
#   (Settings → Secrets → Actions), matching the Vercel CRON_SECRET.

name: Auto-Reply Cron

on:
  schedule:
    # Every 5 minutes — GitHub's shortest allowed interval — but only across the
    # UTC band that contains 09:00-17:59 New York in both halves of the year:
    #   EDT (UTC-4) needs UTC 13-21
    #   EST (UTC-5) needs UTC 14-22
    # 13-23 covers all nine hours in both, verified against each. Ticking
    # overnight would just be ~180 daily no-ops on hours that can never send.
    - cron: "*/5 13-23 * * *"
  workflow_dispatch: # Manual trigger from the GitHub UI

# A slow run must never overlap the next tick — two pipelines scanning the same
# unread mail at once is how one recruiter gets two copies. The reserve-row in
# replied_emails would catch it, but not racing at all is cheaper than relying
# on that.
concurrency:
  group: auto-reply-cron
  cancel-in-progress: false

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger auto-reply
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://krishnaamarneni.com/api/cron/auto-reply")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Auto-reply cron failed with HTTP $HTTP_CODE"
            exit 1
          fi

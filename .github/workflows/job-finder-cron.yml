# Job Finder automation — free via GitHub Actions.
#
# Calls /api/cron/job-finder every 15 minutes. Each tick sweeps a slice of the
# ~75 employer job boards, saves anything new, then spends the rest of its time
# budget scoring unscored listings against the profile in Job Finder → Settings.
#
# Vercel Hobby crons only fire once a day, which is why this lives here.
#
# Setup for manual dispatch: add CRON_SECRET as a GitHub repo secret
#   (Settings → Secrets and variables → Actions → New repository secret)
#   using the same value as the Vercel CRON_SECRET env var.
#
# GitHub may skip or delay scheduled runs when the Actions queue is busy, so
# treat the cadence as "about every 15 minutes", not a guarantee. The cursor
# means a skipped tick costs nothing — the next one continues where it left off.

name: Job Finder Cron

# Re-enabled. The earlier failures were the endpoint exceeding the 60s function
# limit and returning 504 — a wrong secret would have failed in about two
# seconds, not the 1m4s that was actually observed. The budget is now 32s, so
# this works with the CRON_SECRET already stored in GitHub and needs no new
# configuration.
#
# supabase/job_cron.sql does the same job from Postgres and is more reliable,
# since GitHub delays and drops scheduled runs when its queue is busy. It needs
# a secret value you can read back, which is why it is optional rather than the
# default. If you switch to it, comment the schedule below out again so both are
# not firing at once.
on:
# ---------------------------------------------------------------------------
# SCHEDULE DISABLED 2026-11-05 — Vercel Hobby paused every deployment for
# exceeding Fluid Active CPU (6h 52m against a 4h/month allowance). These
# workflows do no work themselves; they curl krishnaamarneni.com, so every
# tick was spending Vercel CPU. Re-enable by uncommenting the schedule block
# below — but only after the per-tick CPU cost comes down, or the account
# will be paused again.
# ---------------------------------------------------------------------------
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Leave blank for a normal tick, or 'score' to only score"
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Reads the switch from Supabase, NOT from the site. This is the whole
      # point: a job that is switched off costs zero Vercel CPU, where a flag
      # checked inside the route would still spend a function invocation on
      # every tick.
      #
      # Missing secrets stop the job; a failed query does not. Those are
      # different situations: no secrets is a setup the account cannot afford to
      # guess about, while a Supabase blip is transient and the route checks the
      # switch again anyway.
      - name: Check the switch
        id: gate
        run: |
          # No secrets means the switches cannot be read. Skip rather than run:
          # this account was paused for exceeding its CPU allowance, so an
          # unreadable switch must not mean "run everything at full rate".
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY are not set as repo secrets, so the on/off switches cannot be read. Skipping to protect the Vercel CPU budget."
            exit 0
          fi
          # Config is present, so a failed or empty query is transient: run, and
          # let the route's own check catch it. Only an explicit false stops us.
          BODY=$(curl -s --max-time 20 \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/cron_switches?select=enabled&key=eq.job-finder" || echo "")
          case "$BODY" in
            *'"enabled":false'*)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::job-finder is switched off in Admin → Settings → Scheduled jobs. Skipping; no Vercel call made."
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Trigger Job Finder crawl
        if: steps.gate.outputs.skip != 'true'
        run: |
          URL="https://krishnaamarneni.com/api/cron/job-finder?trigger=github"
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            URL="$URL&mode=${{ github.event.inputs.mode }}"
          fi
          RESPONSE=$(curl -s --max-time 120 -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Job Finder cron failed with HTTP $HTTP_CODE"
            exit 1
          fi

# Scheduled agent runs — free via GitHub Actions.
# Calls /api/cron/agents on krishnaamarneni.com four times a day, during
# New York business hours (see the schedule note below).
# The endpoint scans inbox for recruiter emails, saves contacts,
# and runs a quick news check.
#
# Setup: Add CRON_SECRET as a GitHub repo secret
#   (Settings → Secrets → Actions → New secret)
#   Use the same value as your Vercel CRON_SECRET.

name: Agent Cron

on:
  schedule:
    # Four runs a day, positioned so every one lands inside the auto-reply
    # window of 09:00-18:00 America/New_York.
    #
    # GitHub cron is UTC and has no DST, so the hours are chosen to hold in both
    # halves of the year:
    #   EDT (UTC-4): 10:00 12:00 14:00 16:00 New York
    #   EST (UTC-5): 09:00 11:00 13:00 15:00 New York
    #
    # The previous 0,6,12,18 UTC put only ONE of the four inside that window,
    # so a recruiter email arriving just after it could wait nearly a full day.
    # Same number of runs, same cost — only the hours moved.
    - cron: "0 14,16,18,20 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger agent cron
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://krishnaamarneni.com/api/cron/agents")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Agent cron failed with HTTP $HTTP_CODE"
            exit 1
          fi

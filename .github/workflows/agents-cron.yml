# Scheduled agent runs — free via GitHub Actions.
# Calls /api/cron/agents on krishnaamarneni.com four times a day, during
# New York business hours (see the schedule note below).
# The endpoint scans inbox for recruiter emails, saves contacts,
# and runs a quick news check.
#
# Setup: Add CRON_SECRET as a GitHub repo secret
#   (Settings → Secrets → Actions → New secret)
#   Use the same value as your Vercel CRON_SECRET.

name: Agent Cron

on:
# ---------------------------------------------------------------------------
# SCHEDULE DISABLED 2026-11-05 — Vercel Hobby paused every deployment for
# exceeding Fluid Active CPU (6h 52m against a 4h/month allowance). These
# workflows do no work themselves; they curl krishnaamarneni.com, so every
# tick was spending Vercel CPU. Re-enable by uncommenting the schedule block
# below — but only after the per-tick CPU cost comes down, or the account
# will be paused again.
# ---------------------------------------------------------------------------
  schedule:
    # Four runs a day across US working hours.
    #   EDT (UTC-4): 10:00 12:00 14:00 16:00 New York
    #   EST (UTC-5): 09:00 11:00 13:00 15:00 New York
    #
    # Auto-reply no longer runs here — it has its own 15-minute schedule in
    # auto-reply-cron.yml, because its value depends on answering quickly while
    # these agents are expensive and do not.
    - cron: "0 14,16,18,20 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Reads the switch from Supabase, NOT from the site. This is the whole
      # point: a job that is switched off costs zero Vercel CPU, where a flag
      # checked inside the route would still spend a function invocation on
      # every tick. Only an explicit false stops the run, so a missing table or
      # an unreachable Supabase fails open and the job behaves as before.
      - name: Check the switch
        id: gate
        run: |
          OFF=""
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            BODY=$(curl -s --max-time 20 \
              -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/cron_switches?select=enabled&key=eq.agents" || echo "")
            case "$BODY" in *'"enabled":false'*) OFF=1 ;; esac
          fi
          if [ -n "$OFF" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::agents is switched off in Admin → Settings → Scheduled jobs. Skipping; no Vercel call made."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger agent cron
        if: steps.gate.outputs.skip != 'true'
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://krishnaamarneni.com/api/cron/agents")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Agent cron failed with HTTP $HTTP_CODE"
            exit 1
          fi

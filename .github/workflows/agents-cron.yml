# Scheduled agent runs — free via GitHub Actions.
# Calls /api/cron/agents on krishnaamarneni.com four times a day, during
# New York business hours (see the schedule note below).
# The endpoint scans inbox for recruiter emails, saves contacts,
# and runs a quick news check.
#
# Setup: Add CRON_SECRET as a GitHub repo secret
#   (Settings → Secrets → Actions → New secret)
#   Use the same value as your Vercel CRON_SECRET.

name: Agent Cron

on:
  schedule:
    # Four runs a day across US working hours.
    #   EDT (UTC-4): 10:00 12:00 14:00 16:00 New York
    #   EST (UTC-5): 09:00 11:00 13:00 15:00 New York
    #
    # Auto-reply no longer runs here — it has its own 15-minute schedule in
    # auto-reply-cron.yml, because its value depends on answering quickly while
    # these agents are expensive and do not.
    - cron: "0 14,16,18,20 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger agent cron
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://krishnaamarneni.com/api/cron/agents")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Agent cron failed with HTTP $HTTP_CODE"
            exit 1
          fi

# Warm check-in outreach — once a day.
#
# Unlike auto-reply, speed is worth nothing here: nobody is waiting on an
# unsolicited note. The cap is 3 a day, so a single daily run is enough.
#
# 15:00 UTC lands at 11:00 New York in summer and 10:00 in winter, both inside
# the 09:00-18:00 send window the pipeline enforces independently.
#
# Setup: CRON_SECRET must exist as a GitHub repo secret, matching Vercel's.

name: Warm Outreach Cron

on:
# ---------------------------------------------------------------------------
# SCHEDULE DISABLED 2026-11-05 — Vercel Hobby paused every deployment for
# exceeding Fluid Active CPU (6h 52m against a 4h/month allowance). These
# workflows do no work themselves; they curl krishnaamarneni.com, so every
# tick was spending Vercel CPU. Re-enable by uncommenting the schedule block
# below — but only after the per-tick CPU cost comes down, or the account
# will be paused again.
# ---------------------------------------------------------------------------
  schedule:
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

# Never let two runs overlap — both would read the same "sent today" count
# before either wrote a row, and the daily cap would be exceeded.
concurrency:
  group: warm-outreach-cron
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reads the switch from Supabase, NOT from the site. This is the whole
      # point: a job that is switched off costs zero Vercel CPU, where a flag
      # checked inside the route would still spend a function invocation on
      # every tick. Only an explicit false stops the run, so a missing table or
      # an unreachable Supabase fails open and the job behaves as before.
      - name: Check the switch
        id: gate
        run: |
          OFF=""
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            BODY=$(curl -s --max-time 20 \
              -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/cron_switches?select=enabled&key=eq.warm-outreach" || echo "")
            case "$BODY" in *'"enabled":false'*) OFF=1 ;; esac
          fi
          if [ -n "$OFF" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::warm-outreach is switched off in Admin → Settings → Scheduled jobs. Skipping; no Vercel call made."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger warm outreach
        if: steps.gate.outputs.skip != 'true'
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://krishnaamarneni.com/api/cron/warm-outreach")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Warm outreach failed with HTTP $HTTP_CODE"
            exit 1
          fi

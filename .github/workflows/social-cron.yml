# Social Autopilot + drip queue.
#
# Calls /api/cron/social-drip every 15 minutes. That endpoint does two things:
#   • runs the Autopilot generator when its post window is reached
#   • flushes social_queue — any post whose due_at has passed goes to Buffer
#
# Why it exists: social-drip had no schedule at all. Autopilot only ran when
# "Post now" was pressed by hand, and the queue was only flushed by the daily
# social-queue cron at 12:00 UTC — so a post due at 10:00 America/Chicago
# (15:00 UTC) waited until the next day's run, roughly 21 hours late.
#
# Fifteen minutes is the right cadence because due_at is a specific time of day;
# a daily flush cannot honour it.
#
# Vercel cron is not an option here — the Hobby plan fires once a day.
#
# Setup: CRON_SECRET must exist as a GitHub repo secret. It already does, and
# is the same value the Job Finder workflow uses.

name: Social Cron

on:
# ---------------------------------------------------------------------------
# SCHEDULE DISABLED 2026-11-05 — Vercel Hobby paused every deployment for
# exceeding Fluid Active CPU (6h 52m against a 4h/month allowance). These
# workflows do no work themselves; they curl krishnaamarneni.com, so every
# tick was spending Vercel CPU. Re-enable by uncommenting the schedule block
# below — but only after the per-tick CPU cost comes down, or the account
# will be paused again.
# ---------------------------------------------------------------------------
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Reads the switch from Supabase, NOT from the site. This is the whole
      # point: a job that is switched off costs zero Vercel CPU, where a flag
      # checked inside the route would still spend a function invocation on
      # every tick. Only an explicit false stops the run, so a missing table or
      # an unreachable Supabase fails open and the job behaves as before.
      - name: Check the switch
        id: gate
        run: |
          OFF=""
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            BODY=$(curl -s --max-time 20 \
              -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/cron_switches?select=enabled&key=eq.social-drip" || echo "")
            case "$BODY" in *'"enabled":false'*) OFF=1 ;; esac
          fi
          if [ -n "$OFF" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::social-drip is switched off in Admin → Settings → Scheduled jobs. Skipping; no Vercel call made."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run social drip and autopilot
        if: steps.gate.outputs.skip != 'true'
        run: |
          RESPONSE=$(curl -s --max-time 120 -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://krishnaamarneni.com/api/cron/social-drip?trigger=github")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Social cron failed with HTTP $HTTP_CODE"
            exit 1
          fi
